[package]
name = "petri-executor-docker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Docker executor: a long-lived container with the workspace bind-mounted."
publish = false

[lints]
workspace = true

[lib]
# The package is `petri-executor-docker`; the crate is `executor_docker`, so code reads `executor_docker::…`.
name = "executor_docker"

[dependencies]
executor = { workspace = true }
ir = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
tokio = { workspace = true }
