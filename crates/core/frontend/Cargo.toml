[package]
name = "petri-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared frontend machinery: diagnostics, spanned YAML, the expression grammar, graph printing."

[lib]
# The package is `petri-frontend`; the crate is `frontend`, so code reads `frontend::…`.
name = "frontend"

[dependencies]
ir = { workspace = true }
marked-yaml = { workspace = true }
yaml-rust2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
