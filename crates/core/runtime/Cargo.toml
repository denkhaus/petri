[package]
name = "petri-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core assembled: the standard runtime, and the facade over core's layers."
publish = false

[lib]
# The package is `petri-runtime`; the crate is `runtime`, so code reads `runtime::…`.
name = "runtime"

[dependencies]
ir = { workspace = true }
engine = { workspace = true }
executor = { workspace = true }
executor-host = { workspace = true }
executor-docker = { workspace = true }
steps = { workspace = true }
driver = { workspace = true }
frontend = { workspace = true }
frontend-native = { workspace = true }
async-trait = { workspace = true }
smol_str = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
testkit = { workspace = true }
