[package]
name = "petri-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The IO loop between the pure core and real processes."
publish = false

[lints]
workspace = true

[lib]
# The package is `petri-driver`; the crate is `driver`, so code reads `driver::…`.
name = "driver"

[dev-dependencies]
engine = { workspace = true }
testkit = { workspace = true }
executor-sandbox = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
ir = { workspace = true }
engine = { workspace = true }
executor = { workspace = true }
steps = { workspace = true }
store = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
