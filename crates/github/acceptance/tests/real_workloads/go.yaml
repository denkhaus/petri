# A real Go build: the pinned setup-go action installs a pinned toolchain
# into the tool cache, and a compiled binary runs. Unlike the image-native
# probes, this one exercises the action -> tool cache -> PATH -> build chain,
# which is how corpus workflows actually get Go.
# `__IMAGE__` is replaced with the pinned runner image by the test.
on: push
jobs:
  go:
    runs-on: ubuntu-latest
    container: __IMAGE__
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.23.4
          cache: false
      - run: |
          cat > hello.go <<'EOF'
          package main
          import "fmt"
          func main() { fmt.Println("go-built-and-ran", "1+1=2") }
          EOF
          go build -o hello hello.go
          ./hello
