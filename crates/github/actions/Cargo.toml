[package]
name = "petri-github-actions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GitHub Actions step kinds: run: steps with the env-file protocol, and JavaScript actions fetched from their repositories."

[lib]
# The package is `petri-github-actions`; the crate is `github_actions`, so code reads `github_actions::…`.
name = "github_actions"

[dependencies]
ir = { workspace = true }
executor = { workspace = true }
steps = { workspace = true }
frontend-gha = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
runtime = { workspace = true }
frontend = { workspace = true }
testkit = { workspace = true }
