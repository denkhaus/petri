# The Fabro oracle generator: runs the shared scripted cases in
# `crates/fabro/oracle/cases/` through Fabro's own engine (the pinned checkout
# under `crates/fabro/corpus/fabro`) and writes what Fabro did to
# `crates/fabro/oracle/expected/`. Not a Petri workspace member: it depends
# on Fabro's crates by path, so it builds only where the corpus is fetched,
# through `scripts/oracle-regenerate.sh`. Petri CI never builds it; it
# compares against the committed fixtures.
[package]
name = "fabro-oracle-generator"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
fabro-workflow = { path = "../../corpus/fabro/lib/components/fabro-workflow", features = ["test-support"] }
fabro-graphviz = { path = "../../corpus/fabro/lib/components/fabro-graphviz" }
fabro-agent = { path = "../../corpus/fabro/lib/components/fabro-agent" }
fabro-types = { path = "../../corpus/fabro/lib/foundation/fabro-types" }
fabro-core = { path = "../../corpus/fabro/lib/foundation/fabro-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ulid = "1"
