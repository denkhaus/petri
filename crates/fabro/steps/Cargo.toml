[package]
name = "petri-fabro-steps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fabro step kinds: command, wait, human, agent over ACP or native Pebble, nested workflow, and the stub registry that simulates them all."
publish = false

[lints]
workspace = true

[lib]
# The package is `petri-fabro-steps`; the crate is `fabro_steps`, so code reads `fabro_steps::…`.
name = "fabro_steps"

[dependencies]
pebble-coding-agent = { workspace = true }
pebble-agent = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
regex = { workspace = true }
lithos-llm = { workspace = true, features = ["runtime"] }
tokio-util = { workspace = true }
globset = { workspace = true }
ir = { workspace = true }
executor = { workspace = true }
execution = { workspace = true }
steps = { workspace = true }
runtime = { workspace = true }
frontend = { workspace = true }
frontend-fabro = { workspace = true }
async-trait = { workspace = true }
jsonschema = { workspace = true }
shlex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pebble-coding-agent = { workspace = true, features = ["test-util"] }
testkit = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
