[package]
name = "petri-fabro-steps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fabro step kinds: command, wait, human, agent over ACP, nested workflow, and the stub registry that simulates them all."
