id = "fallback-session-handoff"
title = "Model fallback keeps the conversation across the handoff"
scenarios = ["fallback-*"]
bundles = ["*"]
fabro = "The session is discarded and a new one runs the original prompt from scratch on the next route, repeating any tool effect."
petri = "The failed session's record resumes on the next route; a turn whose tool effects already ran continues with an agent-sourced continuation message, never repeated."
user_visible_effect = "After a failover past a completed tool effect, Fabro repeats the effect and Petri does not; the fallback route's first request carries the history on Petri and the bare prompt on Fabro."
reason = "Readiness item 9a asks that a fallback not repeat completed work; Pebble has no continue-an-unfinished-turn entry point, so Petri sends a continuation message (task 12)."
acceptance = "Scoped to fallback scenarios: the request counts and per-request matchers differ after the failover, and a repeated tool effect on Fabro is a baseline difference the scenario asserts explicitly."

[[accepts]]
kind = "request"
field = "requests[*]"

[[accepts]]
kind = "request.count"

[[accepts]]
kind = "count"
field = "counts.provider_requests"
