id = "mcp-catalog-and-transports"
title = "MCP catalog references and in-string secrets are refused"
scenarios = ["*"]
bundles = ["*"]
fabro = "Catalog ids resolve from the server; secrets resolve anywhere in transport strings; `protocol = \"sse\"` is supported."
petri = "`id = ...` is refused at load. `{{ secrets.* }}` resolves only as a whole `env`/`headers` value. `protocol = \"sse\"` is accepted on `http` and `sandbox` servers as in Fabro (since 2026-09-12; refused before), spoken by Pebble's MCP client, with a sandbox server's stream at `/sse` under the route. `sandbox` servers are reached through the provider's preview URL on every backend (host, Docker, Daytona), as in Fabro."
user_visible_effect = "A bundle using a catalog reference or an in-string secret loads on Fabro only."
reason = "Task 13; the standalone runner has no server catalog, and a secret is resolved at launch as a whole value so it never enters a command line or URL. The port-forward gap closed with the sandbox-driver re-pin (`a225832`). The legacy SSE refusal existed because Petri's own MCP client did not speak SSE; the servers run through Pebble's `mcp` feature now, which does, so the refusal was lifted rather than kept as a difference."
acceptance = "A scenario using a catalog reference or an in-string secret records Fabro's success against Petri's load failure under a scoped entry; none does today. An SSE server is no difference: `petri-attractor-steps::mcp::sse_servers_are_reached_at_their_stream_over_http_and_under_a_sandbox_route` reaches one over `http` and under a `sandbox` route."
