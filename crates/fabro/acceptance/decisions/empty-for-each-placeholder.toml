id = "empty-for-each-placeholder"
title = "An empty for_each fires the template once with a placeholder"
scenarios = ["*"]
bundles = ["*"]
fabro = "Zero branches; the run jumps to the join."
petri = "The template fires once with the IR's placeholder item (`{\"$placeholder\": true}`, `ir::placeholder::PLACEHOLDER_ITEM_KEY`); the fan-in strips its envelope and joins zero results with no model call. The placeholder clone is no branch: branch maps give it no role, and `fork_started` and `fork_completed` carry zero branches with no `branch_completed`."
user_visible_effect = "None at the join: `parallel.results` is empty and `parallel.branch_count` is 0 in both engines. The clone's own firing (`<template>#0`, `synthetic: true`, no branch role) shows in the node events and the inspect history only."
reason = "Petri's fan-out lowering needs one firing to reach the collector."
acceptance = "Black box `an_empty_for_each_list_joins_without_calling_the_model` (zero typed branches through `replay_run`) and `petri-attractor-steps::parallel::an_empty_for_each_list_joins_with_no_branches_and_no_child` (live and replayed); the projection shows no fork difference, so nothing is accepted here."
