id = "fallback-repeated-tool-effect"
title = "Fabro repeats a completed tool effect when it fails over; Petri does not"
scenarios = ["fallback-failover"]
bundles = ["*"]
# The independent expectation the pinned Fabro fails in this scenario. The
# differential cell reports it as a baseline defect, the coverage report
# treats the Fabro record's failed assertion as expected, and Petri must
# still pass it.
known_defects = ["the append ran exactly once across the failover"]
fabro = "On failover the session is discarded and the original prompt runs from scratch on the next route. In fallback-failover the append ran on the primary before the 503, and runs again on Anthropic: notes.txt reads `draft`, `reviewed`, `reviewed`."
petri = "The failed session's record resumes on the next route and the next model answers the committed tool result with no new input: notes.txt reads `draft`, `reviewed`."
user_visible_effect = "A non-idempotent tool effect before a failover happens twice on Fabro and once on Petri; Fabro's first Anthropic request carries the bare prompt, Petri's carries the tool history."
reason = "Readiness item 9a requires that a fallback not repeat completed work. The pinned Fabro violates that independent contract; the cell records it as a known baseline defect (`known_defects`) and Petri must still pass the contract. This record only lets the comparison name the resulting artifact and request differences; it never relaxes Petri's expectation."
acceptance = "Only `artifacts.notes.txt`, the Anthropic request sequence and the request counts may differ, and only in fallback-failover. Retire this record if a later Fabro pin keeps the session across a failover."

[[accepts]]
kind = "artifact"
field = "artifacts.notes.txt"
