id = "command-output-trailing-newline"
title = "A command's output gains a final newline in Petri"
scenarios = ["*"]
bundles = ["*"]
fabro = "`command.output` is the script's stdout and stderr byte for byte; `printf '%s' x` yields `x`."
petri = "The sandbox plugin streams a command's output as line records, and the command step joins them with a newline after each, so a final line the script did not terminate gains one: `printf '%s' x` yields `x\n`. Output the script did terminate is identical."
user_visible_effect = "A downstream reader of `command.output` (a `stdin_source` consumer, a routing directive parser, a prompt template) sees one extra trailing newline when the script's last line had none. JSON parsing and the helpers in the required bundles are unaffected; a byte-exact consumer would differ."
reason = "Not intentional: a tracked departure. The sandbox-driver exec output path carries lines without the final line's newline state, so Petri cannot restore the exact bytes. This is Petri's own execution path (every provider is reached through the plugin protocol), so the fix is a protocol change recorded as a library gap in `.ai/reviews/fabro-unified/task18-differential.md`."
acceptance = "The comparison accepts only the exact shape `petri == fabro + \"\\n\"` on a `command.output` value (kind `value.trailing_newline`); any other output difference stays unresolved. Retire this record when the plugin reports the final line's newline state and the parallel-results cell passes without it."

[[accepts]]
kind = "value.trailing_newline"
field = "*command.output"
