version: 1

rules:
  - id: format.yaml
    match:
      paths:
        - "**/*.{yaml,yml}"
    checks:
      - id: key-spelling
        category: correctness
        guidance: |
          Check for spelling errors in yaml-keys within YAML files; ignore the content of yaml-values.
