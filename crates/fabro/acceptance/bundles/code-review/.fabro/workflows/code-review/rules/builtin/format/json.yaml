version: 1

rules:
  - id: format.json
    match:
      paths:
        - "**/*.{json,json5}"
    checks:
      - id: key-spelling
        category: correctness
        guidance: |
          Check JSON files for spelling errors in json-keys; ignore the content of json-values.
