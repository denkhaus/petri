_version = 1

[workflow]
graph = "security-review.fabro"

[run]
goal = "Verify the security-review workflow against its deliberate command-injection fixture."

[run.inputs]
mode = "scan"
effort = "low"
scope = ".fabro/workflows/security-review/fixtures/command_injection_service.py"
base = ""
commit = ""
range = ""
focus = ""
expected_finding_count = "1"
expected_rule_id = "command-injection.shell-command"

[run.run_branch]
enabled = false

[run.pull_request]
enabled = false

[run.model.fallbacks]
"kimi-k3" = ["moonshot:kimi-k3", "openrouter:kimi-k3", "claude-opus-5"]

[run.environment]
id = "security-review"

[run.environment.env]
GITHUB_TOKEN = ""
GH_TOKEN = ""

[run.artifacts]
include = [
  "SECURITY-REVIEW-*/.gitignore",
  "SECURITY-REVIEW-*/SECURITY-REVIEW-RESULTS.md",
  "SECURITY-REVIEW-*/SECURITY-REVIEW-RESULTS.html",
  "SECURITY-REVIEW-*/SECURITY-REVIEW-RESULTS.jsonl",
  "SECURITY-REVIEW-*/evidence/scan-manifest.json",
  "SECURITY-REVIEW-*/evidence/candidate-ledger.jsonl",
  "SECURITY-REVIEW-*/evidence/findings.json",
  "SECURITY-REVIEW-*/evidence/coverage.json",
  "SECURITY-REVIEW-*/evidence/panel-votes.jsonl",
  "SECURITY-REVIEW-*/metadata/revision.json",
  "SECURITY-REVIEW-*/metadata/state.json",
  "SECURITY-REVIEW-*/metadata/scan-meta.json",
]

[environments.security-review]
provider = "daytona"

# The scan's agents search the tree constantly. The mirrored buildpack-deps
# noble image is the Daytona default base. It ships grep but not ripgrep,
# which respects .gitignore
# and is far faster on a large repository.
[environments.security-review.image]
dockerfile = """
FROM ghcr.io/lithoscomputer/docker-mirror/buildpack-deps:noble@sha256:1fdce57bbb1105e0e515f6523bd0c3eb1df8b601847cfea140483672f6484afa
RUN apt-get update && apt-get install -y --no-install-recommends ripgrep && rm -rf /var/lib/apt/lists/*
"""

[environments.security-review.resources]
cpu = 2
memory = "4GB"
