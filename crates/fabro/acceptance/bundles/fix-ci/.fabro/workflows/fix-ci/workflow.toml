_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Fix deterministic CI failures on {{ inputs.target }} in {{ inputs.target_repository }} and update the existing branch"

[run.inputs]
target_repository = "interface"
target = ""

[run.clone]
depth = 1

# This workflow updates an existing target branch itself. Fabro must not create
# or push a Factory run branch, and it must not open another pull request.
[run.run_branch]
enabled = false

[run.pull_request]
enabled = false

[run.integrations.github]
additional_repositories = [
  "veniceai/interface",
]

[run.integrations.github.permissions]
contents = "write"
pull_requests = "read"

[run.checkpoint]
skip_git_hooks = true
exclude_globs = [
  ".fabro/workflows/fix-ci/runtime",
]

[run.environment]
id = "fix-ci"

[run.artifacts]
include = [
  ".fabro/workflows/fix-ci/runtime/check-summary.txt",
  ".fabro/workflows/fix-ci/runtime/logs/*.log",
  ".fabro/workflows/fix-ci/runtime/state.json",
]

[environments.fix-ci]
provider = "daytona"

[environments.fix-ci.image]
dockerfile = { path = "../../images/regular/Dockerfile" }

[environments.fix-ci.resources]
cpu = 4
memory = "16GB"
disk = "10GB"

[environments.fix-ci.env]
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
CI = "true"
RXDB_PREMIUM = "{{ secrets.RXDB_PREMIUM }}"
VENICE_PACKAGE_REGISTRY_READ = "{{ secrets.VENICE_PACKAGE_REGISTRY_READ_PAT }}"
