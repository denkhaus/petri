[package]
name = "petri-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The petri command line."
publish = false

[lints]
workspace = true

[[bin]]
name = "petri"
path = "src/main.rs"

[dependencies]
petri = { workspace = true }
cli = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
# The provider twins the black box harness starts on loopback, pinned by
# revision. Pebble's own CLI tests pin the same revision.
twin-openai = { git = "https://github.com/lithoscomputer/twins", rev = "fedab8e6b9b8e2577bee7d93812a318d6adb4aa4" }
twin-anthropic = { git = "https://github.com/lithoscomputer/twins", rev = "fedab8e6b9b8e2577bee7d93812a318d6adb4aa4" }
# The twins export Axum routers; the harness serves them and captures request
# bodies through a middleware layer.
axum = "0.8"
