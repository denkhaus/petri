[workspace]
resolver = "3"
members = ["crates/ir", "crates/engine", "crates/executor", "crates/steps", "crates/driver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ir = { path = "crates/ir" }
engine = { path = "crates/engine" }
executor = { path = "crates/executor" }
steps = { path = "crates/steps" }
async-trait = "0.1"
libc = "0.2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
