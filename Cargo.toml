[workspace]
resolver = "3"
members = [
    "crates/core/ir",
    "crates/core/engine",
    "crates/core/executor",
    "crates/core/executor-host",
    "crates/core/executor-docker",
    "crates/core/steps",
    "crates/core/driver",
    "crates/core/frontend",
    "crates/core/frontend-native",
    "crates/core/runtime",
    "crates/core/cli",
    "crates/core/testkit",
    "crates/github/frontend",
    "crates/github/actions",
    "crates/github/acceptance",
    "crates/petri/lib",
    "crates/petri/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ir = { package = "petri-ir", path = "crates/core/ir" }
engine = { package = "petri-engine", path = "crates/core/engine" }
executor = { package = "petri-executor", path = "crates/core/executor" }
executor-host = { package = "petri-executor-host", path = "crates/core/executor-host" }
executor-docker = { package = "petri-executor-docker", path = "crates/core/executor-docker" }
steps = { package = "petri-steps", path = "crates/core/steps" }
driver = { package = "petri-driver", path = "crates/core/driver" }
frontend = { package = "petri-frontend", path = "crates/core/frontend" }
frontend-gha = { package = "petri-frontend-gha", path = "crates/github/frontend" }
github-actions = { package = "petri-github-actions", path = "crates/github/actions" }
frontend-native = { package = "petri-frontend-native", path = "crates/core/frontend-native" }
runtime = { package = "petri-runtime", path = "crates/core/runtime" }
cli = { package = "petri-cli-core", path = "crates/core/cli" }
petri = { path = "crates/petri/lib" }
testkit = { package = "petri-testkit", path = "crates/core/testkit" }
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
marked-yaml = "0.8"
# The event parser under `marked-yaml`, used directly by the anchor-resolving
# loader in `petri-frontend`; keep the version in step with `marked-yaml`'s.
yaml-rust2 = "0.10"
proptest = "1.11"
libc = "0.2"
# Full `regex`, not `regex-lite`: the `matches` builtin must accept every pattern
# the frontends it serves validate at parse time, so this is a language-compatibility
# decision, not a binary-size one.
regex = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: GHA matrix axes, object filters and outputs follow document
# order, and a sorted map would silently reorder them.
serde_json = { version = "1", features = ["preserve_order"] }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
