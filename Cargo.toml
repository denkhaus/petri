[workspace]
resolver = "3"
members = ["crates/ir", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ir = { path = "crates/ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
