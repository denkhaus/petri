# These tests share external resources: the corpus action cache and the Docker
# daemon, including its container networks. Run them one at a time.
[test-groups.external]
max-threads = 1

[[profile.default.overrides]]
filter = "package(petri-github-acceptance) | (package(petri-driver) & binary(docker)) | (package(petri-runtime) & (binary(local_executor) | binary(services)))"
test-group = "external"

# Catch a blocked runtime or teardown even when an async timeout cannot run.
[[profile.default.overrides]]
filter = "package(petri-execution) & test(an_execution_restart_keeps_the_container_identity_and_workspace)"
slow-timeout = { period = "60s", terminate-after = 3 }
