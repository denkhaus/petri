name: Read sandbox-driver
description: Configure the read-only deploy key used to fetch the pinned private dependency
inputs:
  deploy-key:
    description: Read-only deploy key for lithoscomputer/sandbox-driver
    required: true
runs:
  using: composite
  steps:
    - name: Configure dependency access
      shell: bash
      env:
        SANDBOX_DRIVER_DEPLOY_KEY: ${{ inputs.deploy-key }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ -z "$SANDBOX_DRIVER_DEPLOY_KEY" ]]; then
          echo 'SANDBOX_DRIVER_DEPLOY_KEY is required to fetch the private dependency.' >&2
          exit 1
        fi
        umask 077
        mkdir -p "$RUNNER_TEMP/petri-sandbox-driver"
        key="$RUNNER_TEMP/petri-sandbox-driver/key"
        printf '%s\n' "$SANDBOX_DRIVER_DEPLOY_KEY" > "$key"
        printf -v command 'ssh -F /dev/null -i %q -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q' \
          "$key" "$ACTION_PATH/known_hosts"
        git config --global core.sshCommand "$command"
