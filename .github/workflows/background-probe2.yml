# Risky half of the background-steps probe: undocumented shapes that could
# fail workflow parsing, quarantined from background-probe.yml.
name: background-probe2
on: workflow_dispatch
jobs:
  # The parallel block, as shown in third-party writeups.
  parallel_block:
    runs-on: ubuntu-latest
    steps:
      - run: echo "before parallel $(date -u +%H:%M:%S)"
      - parallel:
          - name: p1
            run: sleep 4 && echo "p1 done $(date -u +%H:%M:%S)"
          - name: p2
            run: sleep 3 && echo "p2 done $(date -u +%H:%M:%S)"
      - run: echo "after parallel $(date -u +%H:%M:%S)"

  # The cancel keyword — shape guessed as a step key naming the target.
  cancel_step:
    runs-on: ubuntu-latest
    steps:
      - id: lp
        background: true
        run: sleep 60 && echo "lp survived"
      - run: sleep 2 && echo "about to cancel"
      - cancel: lp
      - if: always()
        run: echo "lp outcome=[${{ steps.lp.outcome }}] conclusion=[${{ steps.lp.conclusion }}]"

  # Waiting a background step whose if: gated it off.
  wait_gated:
    runs-on: ubuntu-latest
    steps:
      - id: gated
        background: true
        if: false
        run: echo never
      - wait: gated
      - if: always()
        run: echo "gated outcome=[${{ steps.gated.outcome }}]"

  # wait as a list, and wait-all.
  wait_list:
    runs-on: ubuntu-latest
    steps:
      - id: a
        background: true
        run: sleep 3 && echo a-done
      - id: b
        background: true
        run: sleep 2 && echo b-done
      - wait: [a, b]
      - run: echo "after list wait"
      - id: c
        background: true
        run: sleep 2 && echo c-done
      - wait-all: true
      - run: echo "after wait-all"
